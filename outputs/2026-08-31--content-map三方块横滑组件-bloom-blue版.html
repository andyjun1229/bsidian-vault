<!-- ============================================================
     Content Map · 三方块横滑组件（甲木样式 × bloom-blue 配色）
     用法：整段复制进公众号编辑器；改三张卡里的文字即可。
     高亮卡 = 当前/重点 PART（现在是第 1 张），想高亮哪张就把
     「高亮卡」的 style 换到那张上。
     ============================================================ -->

<section style="padding:0 10px;margin:0 0 36px;">
  <!-- 标题行：左侧栏目标签 + 右侧滑动提示 -->
  <section style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 12px;">
    <p style="margin:0;font-size:10px;color:#64748B;letter-spacing:2px;font-weight:600;"><span leaf="">3 PARTS · CONTENT MAP</span></p>
    <p style="margin:0;font-size:10px;color:#94A3B8;"><span leaf="">左右滑动</span></p>
  </section>

  <!-- 横滑容器：与甲木原版同构（overflow 横向滚动 + nowrap） -->
  <section style="width:100%;box-sizing:border-box;overflow:auto hidden;white-space:nowrap;padding:0 0 9px;">

    <!-- 卡1 · 高亮卡（深空渐变，bloom-blue 主色） -->
    <section style="display:inline-block;vertical-align:top;white-space:normal;width:132px;height:90px;box-sizing:border-box;padding:13px 12px;margin:0 8px 0 0;border-radius:12px;background:linear-gradient(135deg,#0F172A,#1E293B);border:1px solid #0F172A;box-shadow:0 5px 12px rgba(15,23,42,0.25);">
      <p style="margin:0 0 6px;font-size:9px;line-height:1.2;color:#38BDF8;font-weight:800;letter-spacing:1px;"><span leaf="">PART 01</span></p>
      <p style="margin:0 0 4px;font-size:14px;line-height:1.25;color:#FFFFFF;font-weight:900;"><span leaf="">发布拆解</span></p>
      <p style="margin:0;font-size:10px;line-height:1.35;color:#94A3B8;"><span leaf="">770B、49B、1M</span></p>
    </section>

    <!-- 卡2 · 普通卡 -->
    <section style="display:inline-block;vertical-align:top;white-space:normal;width:132px;height:90px;box-sizing:border-box;padding:13px 12px;margin:0 8px 0 0;border-radius:12px;background:#FFFFFF;border:1px solid #E2E8F0;box-shadow:0 2px 7px rgba(15,23,42,0.04);">
      <p style="margin:0 0 6px;font-size:9px;line-height:1.2;color:#94A3B8;font-weight:800;letter-spacing:1px;"><span leaf="">PART 02</span></p>
      <p style="margin:0 0 4px;font-size:14px;line-height:1.25;color:#0F172A;font-weight:900;"><span leaf="">四场景实测</span></p>
      <p style="margin:0;font-size:10px;line-height:1.35;color:#64748B;"><span leaf="">研报、展馆与游戏</span></p>
    </section>

    <!-- 卡3 · 普通卡（最后一张 margin 右侧归零） -->
    <section style="display:inline-block;vertical-align:top;white-space:normal;width:132px;height:90px;box-sizing:border-box;padding:13px 12px;margin:0;border-radius:12px;background:#FFFFFF;border:1px solid #E2E8F0;box-shadow:0 2px 7px rgba(15,23,42,0.04);">
      <p style="margin:0 0 6px;font-size:9px;line-height:1.2;color:#94A3B8;font-weight:800;letter-spacing:1px;"><span leaf="">PART 03</span></p>
      <p style="margin:0 0 4px;font-size:14px;line-height:1.25;color:#0F172A;font-weight:900;"><span leaf="">独立交付</span></p>
      <p style="margin:0;font-size:10px;line-height:1.35;color:#64748B;"><span leaf="">模型 × 产品 × 工作流</span></p>
    </section>

  </section>
</section>
