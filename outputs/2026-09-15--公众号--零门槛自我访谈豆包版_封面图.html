<!DOCTYPE html><html lang='zh-CN'><head><meta charset='UTF-8'><title>生成公众号封面图</title><style>
  body { margin:0; background:#1E293B; display:flex; flex-direction:column; align-items:center; gap:20px; padding:24px; font-family:-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif; }
  h3 { color:#94A3B8; font-size:13px; letter-spacing:2px; margin:8px 0 0; font-weight:600; }
  .cover { width:900px; height:383px; position:relative; overflow:hidden; background:#0F172A; box-shadow:0 8px 32px rgba(0,0,0,.5); }
  .cover::before { content:''; position:absolute; inset:0;
    background-image:linear-gradient(rgba(56,189,248,.055) 1px, transparent 1px), linear-gradient(90deg, rgba(56,189,248,.055) 1px, transparent 1px);
    background-size:44px 44px; }
  .glow { position:absolute; border-radius:50%; filter:blur(90px); }
  .glow.a { width:520px; height:520px; background:#0EA5E9; top:-220px; right:-120px; opacity:.32; }
  .glow.b { width:480px; height:480px; background:#1D4ED8; bottom:-260px; left:-140px; opacity:.26; }
  .glow.c { width:260px; height:260px; background:#FDE68A; top:-60px; right:200px; opacity:.10; }
  .headline { position:absolute; left:56px; top:64px; width:530px; }
  .kicker { font-size:15px; letter-spacing:6px; color:#38BDF8; font-weight:700; margin-bottom:14px; }
  .title { font-size:46px; font-weight:900; color:#FFFFFF; line-height:1.3; letter-spacing:1px; text-shadow:0 4px 24px rgba(0,0,0,.4); white-space:nowrap; }
  .title .n { color:#38BDF8; }
  .title .u { border-bottom:7px solid #FDE68A; padding-bottom:2px; }
  .sub { margin-top:15px; font-size:16px; color:#94A3B8; letter-spacing:2.5px; }
  .brand { position:absolute; left:56px; bottom:32px; font-size:12px; letter-spacing:3px; color:#64748B; }
  .brand b { color:#94A3B8; }
  .badge { position:absolute; right:52px; bottom:32px; font-size:11px; color:#38BDF8; border:1px solid rgba(56,189,248,.5); padding:4px 11px; letter-spacing:2px; }
  /* chat card */
  .card { position:absolute; right:52px; top:56px; width:264px; background:#16213A; border:1px solid rgba(56,189,248,.25); border-radius:16px; padding:14px 14px 12px; box-shadow:0 12px 40px rgba(0,0,0,.45); }
  .card-head { display:flex; align-items:center; gap:8px; margin-bottom:11px; }
  .ava { width:26px; height:26px; border-radius:50%; background:linear-gradient(135deg,#38BDF8,#1D4ED8); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:900; color:#fff; }
  .card-name { font-size:12px; font-weight:700; color:#E2E8F0; letter-spacing:1px; }
  .card-tag { margin-left:auto; font-size:9px; color:#94A3B8; border:1px solid rgba(148,163,184,.4); padding:2px 6px; border-radius:6px; letter-spacing:1px; }
  .bubble { background:#1E293B; border:1px solid rgba(56,189,248,.18); border-radius:3px 12px 12px 12px; padding:10px 12px; font-size:12.5px; line-height:1.65; color:#CBD5E1; }
  .bubble b { color:#FDE68A; font-weight:700; }
  .layers { display:flex; gap:5px; margin-top:11px; }
  .layer { flex:1; text-align:center; font-size:9.5px; letter-spacing:.5px; padding:5px 0 4px; border-radius:7px; border:1px solid rgba(56,189,248,.3); color:#38BDF8; font-weight:600; }
  .layer.on { background:#FDE68A; color:#0F172A; border-color:#FDE68A; font-weight:800; }
  .typing { display:inline-flex; gap:3px; margin-top:9px; margin-left:4px; }
  .typing i { width:5px; height:5px; border-radius:50%; background:#38BDF8; opacity:.75; }
  .typing i:nth-child(2){ opacity:.45; } .typing i:nth-child(3){ opacity:.2; }
  /* 1:1 variant */
  .cover2 .cc { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .cover2 .kick { font-size:14px; letter-spacing:5px; color:#38BDF8; font-weight:700; margin-bottom:18px; }
  .big { font-size:128px; font-weight:900; color:#fff; line-height:.95; text-shadow:0 6px 30px rgba(14,165,233,.45); }
  .big small { font-size:30px; font-weight:800; color:#94A3B8; letter-spacing:4px; margin-left:8px; }
  .know { margin-top:10px; font-size:37px; font-weight:900; color:#fff; letter-spacing:8px; }
  .know .u { border-bottom:6px solid #FDE68A; padding-bottom:3px; }
  .cover2 .layers { width:300px; margin-top:24px; }
  .cover2 .brand { left:50%; transform:translateX(-50%); bottom:26px; }
</style></head><body><h3>封面图 2.35:1（900×383，公众号首图标准比例）</h3>
<div class="cover">
  <div class="glow a"></div><div class="glow b"></div><div class="glow c"></div>
  <div class="headline">
    <div class="kicker">AI · 自我访谈 · 零门槛版</div>
    <div class="title">一段<span class="n">咒语</span> + 一个豆包<br><span class="n">40</span> 分钟，<span class="u">认清自己</span></div>
    <div class="sub">不装终端 · 不配 API · 只追问，不给答案</div>
  </div>
  <div class="card">
    <div class="card-head">
      <div class="ava">访</div>
      <div class="card-name">自我访谈教练</div>
      <div class="card-tag">豆包</div>
    </div>
    <div class="bubble">你说想「自由」——<b>具体是哪一年、哪一天，发生了什么？</b></div>
    <div class="typing"><i></i><i></i><i></i></div>
    <div class="layers">
      <div class="layer on">L1 逼具体</div><div class="layer">L2 找反例</div><div class="layer">L3 找盲区</div><div class="layer">L4 讲故事</div>
    </div>
  </div>
  <div class="brand"><b>飞叔AI沉思录</b> · SELF INTERVIEW</div>
  <div class="badge">ZERO SETUP</div>
</div>
<h3>次条封面 1:1（520×520）</h3>
<div class="cover cover2" style="width:520px;height:520px;">
  <div class="glow a"></div><div class="glow b"></div>
  <div class="cc">
    <div class="kick">一段咒语 + 一个豆包</div>
    <div class="big">40<small>分钟</small></div>
    <div class="know"><span class="u">认清自己</span></div>
    <div class="layers">
      <div class="layer on">L1 逼具体</div><div class="layer">L2 找反例</div><div class="layer">L3 找盲区</div><div class="layer">L4 讲故事</div>
    </div>
  </div>
  <div class="brand"><b>飞叔AI沉思录</b></div>
</div>
</body></html>
